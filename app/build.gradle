plugins {
    id 'com.android.application'
}

def getConfigValue(String key) {
    def envVal = System.getenv(key)
    if (envVal != null && !envVal.isEmpty()) {
        return envVal
    }
    def props = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { props.load(it) }
        def propVal = props.getProperty(key)
        if (propVal != null && !propVal.isEmpty()) {
            return propVal
        }
    }
    return ""
}

def escapeBuildConfig(String value) {
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace 'com.runningstats.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.runningstats.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "DEFAULT_STRAVA_CLIENT_ID", "\"${escapeBuildConfig(getConfigValue('STRAVA_CLIENT_ID'))}\""
        buildConfigField "String", "DEFAULT_STRAVA_CLIENT_SECRET", "\"${escapeBuildConfig(getConfigValue('STRAVA_CLIENT_SECRET'))}\""
        buildConfigField "String", "DEFAULT_GEMINI_API_KEY", "\"${escapeBuildConfig(getConfigValue('GEMINI_API_KEY'))}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
