plugins {
    id 'com.android.application'
}

def getConfigValue(String key) {
    def envVal = System.getenv(key)
    if (envVal != null && !envVal.isEmpty()) {
        return envVal
    }
    def props = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { props.load(it) }
        def propVal = props.getProperty(key)
        if (propVal != null && !propVal.isEmpty()) {
            return propVal
        }
    }
    return ""
}

def escapeBuildConfig(String value) {
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace 'com.runningstats.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.runningstats.app"
        minSdk 26
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: '0'}"

        buildConfigField "String", "DEFAULT_INTERVALS_API_KEY", "\"${escapeBuildConfig(getConfigValue('INTERVALS_API_KEY'))}\""
        buildConfigField "String", "DEFAULT_GEMINI_API_KEY", "\"${escapeBuildConfig(getConfigValue('GEMINI_API_KEY'))}\""
    }

    signingConfigs {
        debug {
            storeFile file('stravo-debug.p12')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
